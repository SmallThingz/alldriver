name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Zig Version
        run: zig version

      - name: Zig fmt check
        shell: bash
        run: |
          files=$(find . -type f -name '*.zig' \
            -not -path './.zig-cache/*' \
            -not -path './.zig-cache-*/*' \
            -not -path './.zig-global-cache/*' \
            -not -path './zig-out/*')
          zig fmt --check $files

      - name: Unit Tests
        run: zig build test

      - name: Build Examples
        run: zig build examples

      - name: Adversarial Gate (CI Smoke)
        run: |
          mkdir -p artifacts/reports
          zig build tools -- adversarial-detection-gate --allow-missing-browser=1 --allow-launch-probe-failures=1 --out artifacts/reports/ci-adversarial-detection.txt

      - name: Upload CI Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            artifacts/reports/ci-adversarial-detection.txt
